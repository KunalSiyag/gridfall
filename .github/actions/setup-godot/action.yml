name: Set up Godot
description: >-
  Installs the official Godot Linux x86_64 editor binary named in .godot-version (used headless),
  and optionally the x86_64 desktop export templates. Sets $GODOT for later steps.
inputs:
  templates:
    description: Also install the Linux and Windows x86_64 export templates
    required: false
    default: "false"
outputs:
  version:
    description: Godot version from .godot-version, e.g. 4.7.2.stable
    value: ${{ steps.ver.outputs.version }}
runs:
  using: composite
  steps:
    - id: ver
      shell: bash
      run: |
        ver="$(tr -d '[:space:]' < .godot-version)"
        echo "version=$ver" >> "$GITHUB_OUTPUT"
        echo "dl=${ver%.stable}-stable" >> "$GITHUB_OUTPUT"
    - id: cache-bin
      uses: actions/cache@v6
      with:
        path: ~/.godot-bin/${{ steps.ver.outputs.version }}
        key: godot-bin-${{ runner.os }}-${{ steps.ver.outputs.version }}
    - if: steps.cache-bin.outputs.cache-hit != 'true'
      shell: bash
      env:
        VER: ${{ steps.ver.outputs.version }}
        DL: ${{ steps.ver.outputs.dl }}
      run: |
        set -euo pipefail
        dir="$HOME/.godot-bin/$VER"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
          "https://github.com/godotengine/godot/releases/download/$DL/Godot_v${DL}_linux.x86_64.zip"
        unzip -q -o "$RUNNER_TEMP/godot.zip" -d "$dir"
        mv "$dir/Godot_v${DL}_linux.x86_64" "$dir/godot"
        chmod +x "$dir/godot"
        rm -f "$RUNNER_TEMP/godot.zip"
    - shell: bash
      env:
        VER: ${{ steps.ver.outputs.version }}
      run: |
        echo "GODOT=$HOME/.godot-bin/$VER/godot" >> "$GITHUB_ENV"
        "$HOME/.godot-bin/$VER/godot" --version
    - id: cache-tpl
      if: inputs.templates == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.local/share/godot/export_templates/${{ steps.ver.outputs.version }}
        key: godot-templates-x86_64-${{ steps.ver.outputs.version }}
    - if: inputs.templates == 'true' && steps.cache-tpl.outputs.cache-hit != 'true'
      shell: bash
      env:
        VER: ${{ steps.ver.outputs.version }}
        DL: ${{ steps.ver.outputs.dl }}
      run: |
        set -euo pipefail
        dir="$HOME/.local/share/godot/export_templates/$VER"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/templates.tpz" \
          "https://github.com/godotengine/godot/releases/download/$DL/Godot_v${DL}_export_templates.tpz"
        unzip -j -o "$RUNNER_TEMP/templates.tpz" templates/version.txt \
          'templates/linux_*.x86_64' 'templates/windows_*_x86_64.exe' 'templates/windows_*_x86_64_console.exe' -d "$dir"
        rm -f "$RUNNER_TEMP/templates.tpz"
        ls -l "$dir"
