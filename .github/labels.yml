# Label taxonomy applied to the GitHub repo. Re-apply an entry with:
#   gh label create "<name>" --color <color> --description "<description>" --force
- name: "type/bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type/feature"
  color: "a2eeef"
  description: "New feature or request"
- name: "type/chore"
  color: "c5def5"
  description: "Refactor, cleanup, tooling or dependency work"
- name: "type/docs"
  color: "0075ca"
  description: "Documentation only"
- name: "area/sim"
  color: "fbca04"
  description: "Simulation, residents, construction"
- name: "area/ai"
  color: "5319e7"
  description: "GMI client, mayors, prompts"
- name: "area/fp"
  color: "1d76db"
  description: "First/third-person mode, HUD, overview"
- name: "area/world"
  color: "0e8a16"
  description: "Orbit view, rendering, traffic"
- name: "area/assets"
  color: "bfd4f2"
  description: "Models, textures, audio"
- name: "area/tooling"
  color: "c2e0c6"
  description: "Scripts, checks, gate"
- name: "area/ci"
  color: "ededed"
  description: "GitHub Actions and release pipeline"
- name: "priority/p0"
  color: "b60205"
  description: "Crash, data loss or build broken"
- name: "priority/p1"
  color: "d93f0b"
  description: "Major feature broken"
- name: "priority/p2"
  color: "fbca04"
  description: "Has a workaround"
- name: "priority/p3"
  color: "0e8a16"
  description: "Cosmetic or nice to have"
- name: "needs-triage"
  color: "ffffff"
  description: "Needs area and priority"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"
- name: "ci-failure"
  color: "b60205"
  description: "Opened by the nightly gate on failure"
- name: "from-error-tracker"
  color: "e99695"
  description: "Filed from the local error log"
- name: "flaky"
  color: "f9d0c4"
  description: "Test passes only on retry"
