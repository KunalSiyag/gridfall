# GridFall web demo: a plain static server for the Godot web export (tools/export.sh web), for
# GMI AgentBox CE (container port 8080, public 443 -> 8080 by default). No relay, no server-side
# key: players' browsers call api.gmi-serving.com themselves with their own key (CORS is open).
#
# The export is dropped in at /usr/share/nginx/html by the Dockerfile, with .gz copies of the
# engine files made at image build time: gzip_static serves those instead of burning the box's
# 2 vCPUs on compressing a ~half-gigabyte .pck per first-time visitor.

server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# The platform's health check.
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# The loader page must revalidate on every visit so a new build is picked up at once.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	# Engine and data files: an hour of cache plus ETag revalidation (the export's file names are
	# not content-hashed, so "immutable" would pin a stale .pck against a fresh index.html).
	location ~ \.(wasm|pck|js|data|json|png|ico|svg|woff2)$ {
		add_header Cache-Control "public, max-age=3600";
	}

	location / {
		try_files $uri $uri/ =404;
	}

	# Pre-gzipped copies first (made at image build time), then on-the-fly for anything else.
	gzip_static on;
	gzip on;
	gzip_comp_level 6;
	gzip_min_length 256;
	gzip_vary on;
	gzip_types application/wasm application/octet-stream text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
